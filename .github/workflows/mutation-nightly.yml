name: Mutation Testing (Nightly)

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Mutation - crypto (threshold 95%)
        run: make test-mutation-quick

      - name: Mutation - repositories (threshold 95%)
        run: make test-mutation-repos

      - name: Mutation - parser (threshold 55%)
        run: make test-mutation-parser

      - name: Mutation - import (threshold 75%)
        run: make test-mutation-import

      - name: Upload Stryker reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-reports
          path: reports/mutation/
          retention-days: 14
