name: Deploy to GitHub Pages

# Called by ci.yml as its last job, on a push to main and only after every
# gate job passed. Under Gitflow (ADR-0025) main carries releases and
# hotfixes only, so the live site changes with a release, not with every
# merged task. Avoids duplicating the test suite (ci.yml already lints,
# typechecks, runs unit + e2e + prod e2e + size-limit against the same
# commit SHA). Manual dispatch is also supported for re-deploying without
# a new commit; dispatch it on main.
#
# Why workflow_call and not workflow_run: a workflow started by
# workflow_run has the default branch as its GITHUB_REF and GITHUB_SHA.
# The default branch is develop. The github-pages environment lets only
# main deploy and matches that rule against GITHUB_REF, so such a run
# would be refused, and without the rule it would build develop. A called
# workflow runs in the context of its caller, here the push to main.
# Guarded by src/pwa/deployWorkflow.test.ts.
on:
  workflow_call:
  workflow_dispatch:

# GitHub Pages permissions.
permissions:
  contents: read
  pages: write
  id-token: write

# One active Pages deployment at a time; queue others to preserve order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # No job condition here: the gate is the `needs` and `if` of the
    # calling job in ci.yml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make build
      # SPA fallback: GitHub Pages serves 404.html for unknown paths. Copying
      # index.html preserves the React Router state on deep-link direct visits
      # (for example, a shared link to /phylax/chat) until the service worker
      # takes over.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
